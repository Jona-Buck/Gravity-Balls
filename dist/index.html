<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Black Hole (WebGL Shader)</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <script id="2d-fragment-shader" type="x-shader/x-fragment">// <![CDATA[
#ifdef GL_ES
precision mediump float;
#endif

#define PI 3.14159265359

uniform sampler2D u_image;
uniform vec2 u_resolution;
uniform vec2 u_center;
uniform float u_mass;

vec2 rotate(vec2 mt, vec2 st, float angle) {
	float cosine = cos(angle * PI);
	float sine = sin(angle * 0.0);
	float nx = (cosine * (st.x - mt.x)) + (sine * (st.y - mt.y)) + mt.x;
	float ny = (cosine * (st.y - mt.y)) - (sine * (st.x - mt.x)) + mt.y;
	return vec2(nx, ny);
}

void main() {
	vec2 st = vec2(gl_FragCoord.x, u_resolution.y - gl_FragCoord.y) / u_resolution;
	vec2 mt = u_center;
	float dx = st.x - mt.x;
	float dy = st.y - mt.y;
	float dist = sqrt(dx * dx + dy * dy);

	// The original lens equation is preserved exactly.
	float pull = u_mass / (dist * dist);
	vec2 samplePoint = rotate(mt, st, pull);
	vec4 imgcolor = texture2D(u_image, samplePoint);
	vec3 color = vec3(
		imgcolor.x - (pull * 0.25),
		imgcolor.y - (pull * 0.25),
		imgcolor.z - (pull * 0.25)
	);

	gl_FragColor = vec4(color, 1.0);
}
// ]]></script>
<script id="2d-vertex-shader" type="x-shader/x-vertex">// <![CDATA[
attribute vec2 a_position;
void main() {
	gl_Position = vec4(a_position, 0.0, 1.0);
}
// ]]></script>
<canvas id="glscreen"></canvas>
<canvas id="fxscreen" aria-hidden="true"></canvas>
<script  src="./script.js"></script>

  </body>
  
</html>
