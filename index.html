<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity</title>

<style>
body {
    font-family: Helvetica sans-serif;
    padding: 0;
    margin: 0;
    background-color: #222;
    overflow: hidden;
    -webkit-user-select: none;
       -moz-user-select: none;
         -o-user-select: none;
        -ms-user-select: none;
            user-select: none;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    touch-action: none;
}

.info {
    position: absolute;
    top: 0;
    left: 0;
    padding: 5px 15px;
    color: #eee;
    font-size: 13px;
    background-color: rgba(0, 0, 0, .5);
}
</style>

</head>

<body>

<canvas id="c"></canvas>

<script>
/**
 * requestAnimationFrame
 */
window.requestAnimationFrame = (function(){
    return  window.requestAnimationFrame       ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame    ||
            window.oRequestAnimationFrame      ||
            window.msRequestAnimationFrame     ||
            function (callback) {
                window.setTimeout(callback, 1000 / 60);
            };
})();


/**
 * Vector
 */
function Vector(x, y) {
    this.x = x || 0;
    this.y = y || 0;
}

Vector.add = function(a, b) {
    return new Vector(a.x + b.x, a.y + b.y);
};

Vector.sub = function(a, b) {
    return new Vector(a.x - b.x, a.y - b.y);
};

Vector.scale = function(v, s) {
    return v.clone().scale(s);
};

Vector.random = function() {
    return new Vector(
        Math.random() * 2 - 1,
        Math.random() * 2 - 1
    );
};

Vector.prototype = {
    set: function(x, y) {
        if (typeof x === 'object') {
            y = x.y;
            x = x.x;
        }
        this.x = x || 0;
        this.y = y || 0;
        return this;
    },

    add: function(v) {
        this.x += v.x;
        this.y += v.y;
        return this;
    },

    sub: function(v) {
        this.x -= v.x;
        this.y -= v.y;
        return this;
    },

    scale: function(s) {
        this.x *= s;
        this.y *= s;
        return this;
    },

    length: function() {
        return Math.sqrt(this.x * this.x + this.y * this.y);
    },

    lengthSq: function() {
        return this.x * this.x + this.y * this.y;
    },

    normalize: function() {
        var m = Math.sqrt(this.x * this.x + this.y * this.y);
        if (m) {
            this.x /= m;
            this.y /= m;
        }
        return this;
    },

    angle: function() {
        return Math.atan2(this.y, this.x);
    },

    angleTo: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return Math.atan2(dy, dx);
    },

    distanceTo: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return Math.sqrt(dx * dx + dy * dy);
    },

    distanceToSq: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return dx * dx + dy * dy;
    },

    lerp: function(v, t) {
        this.x += (v.x - this.x) * t;
        this.y += (v.y - this.y) * t;
        return this;
    },

    clone: function() {
        return new Vector(this.x, this.y);
    },

    toString: function() {
        return '(x:' + this.x + ', y:' + this.y + ')';
    }
};


/**
 * GravityPoint
 */
function GravityPoint(x, y, radius, targets) {
    Vector.call(this, x, y);
    this.radius = radius;
    this.currentRadius = radius * 0.5;

    this._targets = {
        particles: targets.particles || [],
        gravities: targets.gravities || []
    };
    this._speed = new Vector();
    // Per-hole phase keeps the visual accretion disks from moving in sync.
    this._visualPhase = Math.random() * Math.PI * 2;
}

GravityPoint.RADIUS_LIMIT = 65;
GravityPoint.interferenceToPoint = true;

GravityPoint.prototype = (function(o) {
    var s = new Vector(0, 0), p;
    for (p in o) s[p] = o[p];
    return s;
})({
    gravity:       0.05,
    isMouseOver:   false,
    dragging:      false,
    destroyed:     false,
    _easeRadius:   0,
    _dragDistance: null,
    _collapsing:   false,

    hitTest: function(p) {
        return this.distanceTo(p) < this.radius;
    },

    startDrag: function(dragStartPoint) {
        this._dragDistance = Vector.sub(dragStartPoint, this);
        this.dragging = true;
    },

    drag: function(dragToPoint) {
        this.x = dragToPoint.x - this._dragDistance.x;
        this.y = dragToPoint.y - this._dragDistance.y;
    },

    endDrag: function() {
        this._dragDistance = null;
        this.dragging = false;
    },

    addSpeed: function(d) {
        this._speed = this._speed.add(d);
    },

    collapse: function(e) {
        this.currentRadius *= 1.75;
        this._collapsing = true;
    },

    render: function(ctx) {
        if (this.destroyed) return;

        var particles = this._targets.particles,
            i, len, particle, dx, dy, distanceSq, strength;

        // Apply gravity with scalar math instead of allocating several Vector
        // objects for every particle on every frame.
        for (i = 0, len = particles.length; i < len; i++) {
            particle = particles[i];
            dx = this.x - particle.x;
            dy = this.y - particle.y;
            distanceSq = dx * dx + dy * dy;

            if (distanceSq > 0) {
                strength = this.gravity / Math.sqrt(distanceSq);
                particle._speed.x += dx * strength;
                particle._speed.y += dy * strength;
            }
        }

        this._easeRadius = (this._easeRadius + (this.radius - this.currentRadius) * 0.07) * 0.95;
        this.currentRadius += this._easeRadius;
        if (this.currentRadius < 0) this.currentRadius = 0;

        if (this._collapsing) {
            this.radius *= 0.75;
            if (this.currentRadius < 1) this.destroyed = true;
            this._draw(ctx);
            return;
        }

        var gravities = this._targets.gravities,
            g, dx, dy, distanceSq, contactDistance, strength, absorptionScale,
            area = this.radius * this.radius * Math.PI, garea;

        for (i = 0, len = gravities.length; i < len; i++) {
            g = gravities[i];

            if (g === this || g.destroyed) continue;

            dx = this.x - g.x;
            dy = this.y - g.y;
            distanceSq = dx * dx + dy * dy;
            contactDistance = (this.currentRadius + g.radius) * 0.85;

            // Compare squared distances to avoid an unnecessary square root.
            if (
                (this.currentRadius >= g.radius || this.dragging) &&
                distanceSq < contactDistance * contactDistance
            ) {
                g.destroyed = true;
                this.gravity += g.gravity;

                absorptionScale = g.radius / this.radius * 0.5;
                this._speed.x -= dx * absorptionScale;
                this._speed.y -= dy * absorptionScale;

                garea = g.radius * g.radius * Math.PI;
                this.currentRadius = Math.sqrt((area + garea * 3) / Math.PI);
                this.radius = Math.sqrt((area + garea) / Math.PI);
            }

            // Reuse the distance already calculated and avoid temporary Vectors.
            if (distanceSq > 0) {
                strength = this.gravity / Math.sqrt(distanceSq);
                g._speed.x += dx * strength;
                g._speed.y += dy * strength;
            }
        }

        if (GravityPoint.interferenceToPoint && !this.dragging)
            this.add(this._speed);

        // Reuse the speed Vector instead of allocating a new one every frame.
        this._speed.x = 0;
        this._speed.y = 0;

        if (this.currentRadius > GravityPoint.RADIUS_LIMIT) this.collapse();

        this._draw(ctx);
    },

    _draw: function(ctx) {
        var grd, t, pulse, r, rotation, i, angle, diskRadius, glowRadius;

        if (this.currentRadius <= 0) return;

        t = (window.performance && performance.now ? performance.now() : Date.now()) * 0.001;
        t += this._visualPhase;
        pulse = 0.94 + Math.sin(t * 2.2) * 0.06;
        r = Math.max(2, this.currentRadius);
        diskRadius = Math.max(r * 1.08, this.radius * 1.2);
        glowRadius = diskRadius * 4.2;
        rotation = t * (0.75 + Math.min(1.5, Math.abs(this.gravity)) * 0.18);

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        // Broad gravitational glow, built from gradients rather than shadowBlur.
        grd = ctx.createRadialGradient(this.x, this.y, r * 0.35, this.x, this.y, glowRadius);
        grd.addColorStop(0, 'rgba(15, 8, 28, 0.92)');
        grd.addColorStop(0.18, 'rgba(75, 35, 180, 0.22)');
        grd.addColorStop(0.42, 'rgba(0, 190, 255, 0.11)');
        grd.addColorStop(0.68, 'rgba(255, 100, 25, 0.055)');
        grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        // Flattened, rotating accretion disk with hot inner and cool outer light.
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(rotation);
        ctx.scale(1, 0.32);

        grd = ctx.createRadialGradient(0, 0, r * 0.72, 0, 0, diskRadius * 1.9);
        grd.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grd.addColorStop(0.38, 'rgba(255, 110, 25, 0.04)');
        grd.addColorStop(0.48, 'rgba(255, 165, 60, 0.86)');
        grd.addColorStop(0.56, 'rgba(255, 235, 190, 0.96)');
        grd.addColorStop(0.63, 'rgba(50, 210, 255, 0.72)');
        grd.addColorStop(0.76, 'rgba(100, 70, 255, 0.2)');
        grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, diskRadius * 1.9, 0, Math.PI * 2);
        ctx.fill();

        // Uneven orbital arcs create a turbulent, swirling appearance.
        for (i = 0; i < 3; i++) {
            angle = i * 2.094 + rotation * (i % 2 ? -0.72 : 0.58);
            ctx.beginPath();
            ctx.ellipse(0, 0, diskRadius * (1.05 + i * 0.2), diskRadius * (1.05 + i * 0.2), angle * 0.08, angle, angle + 1.45 + (i % 2) * 0.7);
            ctx.lineWidth = Math.max(1, r * (0.045 - i * 0.008));
            ctx.strokeStyle = i === 0 ? 'rgba(255, 235, 200, 0.95)' :
                (i === 1 ? 'rgba(40, 205, 255, 0.78)' : 'rgba(160, 90, 255, 0.62)');
            ctx.stroke();
        }

        // A few hot spots orbit around the disk to suggest fast-moving matter.
        for (i = 0; i < 4; i++) {
            angle = rotation * (i % 2 ? -1.25 : 1) + i * Math.PI * 0.5 + this._visualPhase;
            var sparkRadius = diskRadius * (1.12 + 0.08 * Math.sin(t * 3 + i));
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * sparkRadius, Math.sin(angle) * sparkRadius, Math.max(1.2, r * 0.075), 0, Math.PI * 2);
            ctx.fillStyle = i % 2 ? 'rgba(80, 220, 255, 0.95)' : 'rgba(255, 220, 160, 1)';
            ctx.fill();
        }
        ctx.restore();

        // Dark event-horizon core with a thin, bright rim.
        grd = ctx.createRadialGradient(this.x - r * 0.18, this.y - r * 0.22, r * 0.05, this.x, this.y, r * 1.08);
        grd.addColorStop(0, 'rgba(1, 1, 8, 1)');
        grd.addColorStop(0.72, 'rgba(0, 0, 5, 1)');
        grd.addColorStop(0.91, 'rgba(5, 4, 18, 1)');
        grd.addColorStop(1, 'rgba(20, 190, 255, 0.82)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 1.04 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 1.045 * pulse, rotation * 0.4, rotation * 0.4 + Math.PI * 1.62);
        ctx.lineWidth = Math.max(1, r * 0.035);
        ctx.strokeStyle = 'rgba(255, 200, 125, 0.88)';
        ctx.stroke();

        ctx.restore();
    }
});


/**
 * Particle
 */
function Particle(x, y, radius) {
    Vector.call(this, x, y);
    this.radius = radius;

    this._latest = new Vector();
    this._speed  = new Vector();
}

Particle.prototype = (function(o) {
    var s = new Vector(0, 0), p;
    for (p in o) s[p] = o[p];
    return s;
})({
    addSpeed: function(d) {
        this._speed.add(d);
    },

    update: function() {
        if (this._speed.length() > 12) this._speed.normalize().scale(12);

        this._latest.set(this);
        this.add(this._speed);
    }
});


(function() {

    var BACKGROUND_COLOR      = 'rgba(11, 51, 56, 1)',
        PARTICLE_RADIUS       = 1,
        G_POINT_RADIUS        = 10,
        G_POINT_RADIUS_LIMITS = 65;

    var canvas, context,
        bufferCvs, bufferCtx,
        screenWidth, screenHeight,
        mouse = new Vector(),
        gravities = [],
        particles = [],
        grad;

    function resize(e) {
        screenWidth  = canvas.width  = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
        bufferCvs.width  = screenWidth;
        bufferCvs.height = screenHeight;
        context   = canvas.getContext('2d');
        bufferCtx = bufferCvs.getContext('2d');

        var cx = canvas.width * 0.5,
            cy = canvas.height * 0.5;

        grad = context.createRadialGradient(cx, cy, 0, cx, cy, Math.sqrt(cx * cx + cy * cy));
        grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
    }

    function mouseMove(e) {
        mouse.set(e.clientX, e.clientY);

        var i, g, hit = false;
        for (i = gravities.length - 1; i >= 0; i--) {
            g = gravities[i];
            if ((!hit && g.hitTest(mouse)) || g.dragging)
                g.isMouseOver = hit = true;
            else
                g.isMouseOver = false;
        }

        canvas.style.cursor = hit ? 'pointer' : 'default';
    }

    function mouseDown(e) {
        // Pointer position must be refreshed on touch: mobile devices may not
        // send a pointermove before the first tap.
        mouse.set(e.clientX, e.clientY);

        for (var i = gravities.length - 1; i >= 0; i--) {
            if (!gravities[i].destroyed && gravities[i].hitTest(mouse)) {
                gravities[i].isMouseOver = true;
                gravities[i].startDrag(mouse);
                return;
            }
        }

        gravities.push(new GravityPoint(e.clientX, e.clientY, G_POINT_RADIUS, {
            particles: particles,
            gravities: gravities
        }));
    }

    function mouseUp(e) {
        for (var i = 0, len = gravities.length; i < len; i++) {
            if (gravities[i].dragging) {
                gravities[i].endDrag();
                break;
            }
        }
    }

    function doubleClick(e) {
        for (var i = gravities.length - 1; i >= 0; i--) {
            if (gravities[i].isMouseOver) {
                gravities[i].collapse();
                break;
            }
        }
    }

    function addParticle(num) {
        var i, p;
        for (i = 0; i < num; i++) {
            p = new Particle(
                Math.floor(Math.random() * screenWidth - PARTICLE_RADIUS * 2) + 1 + PARTICLE_RADIUS,
                Math.floor(Math.random() * screenHeight - PARTICLE_RADIUS * 2) + 1 + PARTICLE_RADIUS,
                PARTICLE_RADIUS
            );
            p.addSpeed(Vector.random());
            particles.push(p);
        }
    }

    function removeParticle(num) {
        if (particles.length < num) num = particles.length;
        for (var i = 0; i < num; i++) {
            particles.pop();
        }
    }

    canvas  = document.getElementById('c');
    bufferCvs = document.createElement('canvas');

    window.addEventListener('resize', resize, false);
    resize(null);

    addParticle(2000);

    // Mouse/stylus: Pointer Events. Touch: explicit Touch Events as well,
    // while ignoring touch Pointer Events so a single tap is never handled twice.
    canvas.addEventListener('pointermove', function(e) {
        if (e.pointerType !== 'touch') mouseMove(e);
    }, false);
    canvas.addEventListener('pointerdown', function(e) {
        if (e.pointerType === 'touch') return;
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
        mouseDown(e);
    }, false);
    canvas.addEventListener('pointerup', function(e) {
        if (e.pointerType === 'touch') return;
        mouseUp(e);
        if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
        }
    }, false);
    canvas.addEventListener('pointercancel', function(e) {
        if (e.pointerType !== 'touch') mouseUp(e);
    }, false);

    // Explicit touch handling for mobile browsers. preventDefault stops the
    // page from scrolling/zooming while the user creates or drags a ball.
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (e.changedTouches.length) mouseDown(e.changedTouches[0]);
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length) mouseMove(e.touches[0]);
    }, { passive: false });
    canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        mouseUp(e);
    }, { passive: false });
    canvas.addEventListener('touchcancel', function(e) {
        mouseUp(e);
    }, false);

    canvas.addEventListener('dblclick', doubleClick, false);

    var loop = function() {

        var i, len, g, p;

        context.save();
        context.fillStyle = BACKGROUND_COLOR;
        context.fillRect(0, 0, screenWidth, screenHeight);
        context.fillStyle = grad;
        context.fillRect(0, 0, screenWidth, screenHeight);
        context.restore();

        for (i = 0, len = gravities.length; i < len; i++) {
            g = gravities[i];
            if (g.dragging) g.drag(mouse);
            g.render(context);
            if (g.destroyed) {
                gravities.splice(i, 1);
                len--;
                i--;
            }
        }

        bufferCtx.save();
        bufferCtx.globalCompositeOperation = 'destination-out';
        bufferCtx.globalAlpha = 0.35;
        bufferCtx.fillRect(0, 0, screenWidth, screenHeight);
        bufferCtx.restore();

        len = particles.length;
        bufferCtx.save();
        bufferCtx.fillStyle = bufferCtx.strokeStyle = '#fff';
        bufferCtx.lineCap = bufferCtx.lineJoin = 'round';
        bufferCtx.lineWidth = PARTICLE_RADIUS * 2;
        bufferCtx.beginPath();

        for (i = 0; i < len; i++) {
            p = particles[i];
            p.update();
            bufferCtx.moveTo(p.x, p.y);
            bufferCtx.lineTo(p._latest.x, p._latest.y);
        }

        // Rounded line caps already render the particle endpoints as dots,
        // so a second pass drawing circles over the same points is redundant.
        bufferCtx.stroke();
        bufferCtx.restore();

        context.drawImage(bufferCvs, 0, 0);

        requestAnimationFrame(loop);
    };

    loop();
document.addEventListener("click", function () {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    }
});
})();
</script>

</body>
</html>
