<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity</title>

<style>
body {
    font-family: Helvetica sans-serif;
    padding: 0;
    margin: 0;
    background-color: #222;
    overflow: hidden;
    -webkit-user-select: none;
       -moz-user-select: none;
         -o-user-select: none;
        -ms-user-select: none;
            user-select: none;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    touch-action: none;
}

.info {
    position: absolute;
    top: 0;
    left: 0;
    padding: 5px 15px;
    color: #eee;
    font-size: 13px;
    background-color: rgba(0, 0, 0, .5);
}
</style>

</head>

<body>

<canvas id="c"></canvas>

<script>
/**
 * requestAnimationFrame
 */
window.requestAnimationFrame = (function(){
    return  window.requestAnimationFrame       ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame    ||
            window.oRequestAnimationFrame      ||
            window.msRequestAnimationFrame     ||
            function (callback) {
                window.setTimeout(callback, 1000 / 60);
            };
})();


/**
 * Vector
 */
function Vector(x, y) {
    this.x = x || 0;
    this.y = y || 0;
}

Vector.add = function(a, b) {
    return new Vector(a.x + b.x, a.y + b.y);
};

Vector.sub = function(a, b) {
    return new Vector(a.x - b.x, a.y - b.y);
};

Vector.scale = function(v, s) {
    return v.clone().scale(s);
};

Vector.random = function() {
    return new Vector(
        Math.random() * 2 - 1,
        Math.random() * 2 - 1
    );
};

Vector.prototype = {
    set: function(x, y) {
        if (typeof x === 'object') {
            y = x.y;
            x = x.x;
        }
        this.x = x || 0;
        this.y = y || 0;
        return this;
    },

    add: function(v) {
        this.x += v.x;
        this.y += v.y;
        return this;
    },

    sub: function(v) {
        this.x -= v.x;
        this.y -= v.y;
        return this;
    },

    scale: function(s) {
        this.x *= s;
        this.y *= s;
        return this;
    },

    length: function() {
        return Math.sqrt(this.x * this.x + this.y * this.y);
    },

    lengthSq: function() {
        return this.x * this.x + this.y * this.y;
    },

    normalize: function() {
        var m = Math.sqrt(this.x * this.x + this.y * this.y);
        if (m) {
            this.x /= m;
            this.y /= m;
        }
        return this;
    },

    angle: function() {
        return Math.atan2(this.y, this.x);
    },

    angleTo: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return Math.atan2(dy, dx);
    },

    distanceTo: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return Math.sqrt(dx * dx + dy * dy);
    },

    distanceToSq: function(v) {
        var dx = v.x - this.x,
            dy = v.y - this.y;
        return dx * dx + dy * dy;
    },

    lerp: function(v, t) {
        this.x += (v.x - this.x) * t;
        this.y += (v.y - this.y) * t;
        return this;
    },

    clone: function() {
        return new Vector(this.x, this.y);
    },

    toString: function() {
        return '(x:' + this.x + ', y:' + this.y + ')';
    }
};


/**
 * GravityPoint
 */
function GravityPoint(x, y, radius, targets) {
    Vector.call(this, x, y);
    this.radius = radius;
    this.currentRadius = radius * 0.5;

    this._targets = {
        particles: targets.particles || [],
        gravities: targets.gravities || []
    };
    this._speed = new Vector();
    // Per-hole phase keeps the visual accretion disks from moving in sync.
    this._visualPhase = Math.random() * Math.PI * 2;
}

GravityPoint.RADIUS_LIMIT = 65;
GravityPoint.interferenceToPoint = true;

GravityPoint.prototype = (function(o) {
    var s = new Vector(0, 0), p;
    for (p in o) s[p] = o[p];
    return s;
})({
    gravity:       0.05,
    isMouseOver:   false,
    dragging:      false,
    destroyed:     false,
    _easeRadius:   0,
    _dragDistance: null,
    _collapsing:   false,

    hitTest: function(p) {
        return this.distanceTo(p) < this.radius;
    },

    startDrag: function(dragStartPoint) {
        this._dragDistance = Vector.sub(dragStartPoint, this);
        this.dragging = true;
    },

    drag: function(dragToPoint) {
        this.x = dragToPoint.x - this._dragDistance.x;
        this.y = dragToPoint.y - this._dragDistance.y;
    },

    endDrag: function() {
        this._dragDistance = null;
        this.dragging = false;
    },

    addSpeed: function(d) {
        this._speed = this._speed.add(d);
    },

    collapse: function(e) {
        this.currentRadius *= 1.75;
        this._collapsing = true;
    },

    render: function() {
        if (this.destroyed) return;

        var particles = this._targets.particles,
            i, len, particle, dx, dy, distanceSq, strength;

        // Apply gravity with scalar math instead of allocating several Vector
        // objects for every particle on every frame.
        for (i = 0, len = particles.length; i < len; i++) {
            particle = particles[i];
            dx = this.x - particle.x;
            dy = this.y - particle.y;
            distanceSq = dx * dx + dy * dy;

            if (distanceSq > 0) {
                strength = this.gravity / Math.sqrt(distanceSq);
                particle._speed.x += dx * strength;
                particle._speed.y += dy * strength;
            }
        }

        this._easeRadius = (this._easeRadius + (this.radius - this.currentRadius) * 0.07) * 0.95;
        this.currentRadius += this._easeRadius;
        if (this.currentRadius < 0) this.currentRadius = 0;

        if (this._collapsing) {
            this.radius *= 0.75;
            if (this.currentRadius < 1) this.destroyed = true;
            return;
        }

        var gravities = this._targets.gravities,
            g, dx, dy, distanceSq, contactDistance, strength, absorptionScale,
            area = this.radius * this.radius * Math.PI, garea;

        for (i = 0, len = gravities.length; i < len; i++) {
            g = gravities[i];

            if (g === this || g.destroyed) continue;

            dx = this.x - g.x;
            dy = this.y - g.y;
            distanceSq = dx * dx + dy * dy;
            contactDistance = (this.currentRadius + g.radius) * 0.85;

            // Compare squared distances to avoid an unnecessary square root.
            if (
                (this.currentRadius >= g.radius || this.dragging) &&
                distanceSq < contactDistance * contactDistance
            ) {
                g.destroyed = true;
                this.gravity += g.gravity;

                absorptionScale = g.radius / this.radius * 0.5;
                this._speed.x -= dx * absorptionScale;
                this._speed.y -= dy * absorptionScale;

                garea = g.radius * g.radius * Math.PI;
                this.currentRadius = Math.sqrt((area + garea * 3) / Math.PI);
                this.radius = Math.sqrt((area + garea) / Math.PI);
            }

            // Reuse the distance already calculated and avoid temporary Vectors.
            if (distanceSq > 0) {
                strength = this.gravity / Math.sqrt(distanceSq);
                g._speed.x += dx * strength;
                g._speed.y += dy * strength;
            }
        }

        if (GravityPoint.interferenceToPoint && !this.dragging)
            this.add(this._speed);

        // Reuse the speed Vector instead of allocating a new one every frame.
        this._speed.x = 0;
        this._speed.y = 0;

        if (this.currentRadius > GravityPoint.RADIUS_LIMIT) this.collapse();

    },

    _draw: function(ctx) {
        var t, r, core, outer, inner, tilt, spin, grd, i,
            a, b, len, alpha, wobble, start, end;

        if (this.currentRadius <= 0) return;

        t = (window.performance && performance.now ? performance.now() : Date.now()) * 0.001;
        r = Math.max(2, this.currentRadius);
        core = r * 0.78;
        inner = core * 1.08;
        outer = Math.max(r * 2.7, this.radius * 1.75);
        tilt = 0.25;
        spin = t * (0.9 + Math.min(0.9, Math.abs(this.gravity) * 2.5)) + this._visualPhase;
        wobble = Math.sin(t * 1.1 + this._visualPhase) * 0.025;

        ctx.save();

        // A restrained, soft reflection in the surrounding teal field.
        // No giant bloom: the particle trails remain the main visual texture.
        grd = ctx.createRadialGradient(this.x, this.y, core * 0.7, this.x, this.y, outer * 1.5);
        grd.addColorStop(0, 'rgba(0, 8, 10, 0.28)');
        grd.addColorStop(0.32, 'rgba(28, 116, 119, 0.14)');
        grd.addColorStop(0.66, 'rgba(29, 101, 103, 0.045)');
        grd.addColorStop(1, 'rgba(11, 51, 56, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(this.x, this.y, outer * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // REAR OF THE ACCRETION DISK
        // A continuous, flattened ring with a bright inner edge and cooler outer gas.
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(spin * 0.12);
        ctx.scale(1, tilt);

        grd = ctx.createRadialGradient(0, 0, inner, 0, 0, outer);
        grd.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grd.addColorStop(0.22, 'rgba(0, 0, 0, 0)');
        grd.addColorStop(0.32, 'rgba(45, 152, 154, 0.12)');
        grd.addColorStop(0.43, 'rgba(101, 219, 210, 0.46)');
        grd.addColorStop(0.49, 'rgba(255, 216, 165, 0.88)');
        grd.addColorStop(0.53, 'rgba(255, 246, 222, 0.96)');
        grd.addColorStop(0.59, 'rgba(110, 218, 207, 0.54)');
        grd.addColorStop(0.76, 'rgba(33, 125, 130, 0.18)');
        grd.addColorStop(1, 'rgba(11, 51, 56, 0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, outer, 0, Math.PI * 2);
        ctx.fill();

        // Curved, uneven streamlines add turbulence without drawing separate neon rings.
        for (i = 0; i < 11; i++) {
            a = spin * (i % 3 === 0 ? -0.24 : 0.16) + i * 2.399;
            b = inner * (1.04 + (i % 4) * 0.13);
            len = outer * (0.28 + (i % 3) * 0.055);
            start = a;
            end = a + 0.48 + (i % 4) * 0.16;
            alpha = 0.18 + (i % 4) * 0.09;

            ctx.beginPath();
            ctx.ellipse(0, 0, b + len * 0.42, (b + len * 0.42) * (0.96 + wobble), 0, start, end);
            ctx.lineWidth = Math.max(0.45, r * (0.014 + (i % 3) * 0.004));
            ctx.strokeStyle = i % 4 === 0
                ? 'rgba(255, 217, 168, ' + alpha + ')'
                : 'rgba(110, 222, 215, ' + alpha + ')';
            ctx.stroke();
        }
        ctx.restore();

        // EVENT HORIZON: an actually opaque, light-absorbing centre.
        // It is rendered with source-over so trails cannot shine through it.
        ctx.globalCompositeOperation = 'source-over';
        grd = ctx.createRadialGradient(
            this.x - core * 0.18, this.y - core * 0.22, core * 0.02,
            this.x, this.y, core * 1.12
        );
        grd.addColorStop(0, '#000304');
        grd.addColorStop(0.78, '#000607');
        grd.addColorStop(0.94, '#010c0e');
        grd.addColorStop(1, 'rgba(4, 27, 29, 0.98)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(this.x, this.y, core * (1 + wobble), 0, Math.PI * 2);
        ctx.fill();

        // Thin photon ring: mostly cool white-teal, with a short warm section.
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.arc(this.x, this.y, core * 1.015, 0, Math.PI * 2);
        ctx.lineWidth = Math.max(0.55, r * 0.018);
        ctx.strokeStyle = 'rgba(175, 238, 228, 0.54)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, core * 1.035, spin * 0.18, spin * 0.18 + Math.PI * 0.48);
        ctx.lineWidth = Math.max(0.8, r * 0.052);
        ctx.strokeStyle = 'rgba(255, 207, 151, 0.72)';
        ctx.stroke();

        // FRONT EDGE: two short, fine arcs, not a complete outline.
        // The lower half suggests the disk wrapping around the black hole.
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(spin * 0.12);
        ctx.scale(1, tilt);
        ctx.beginPath();
        ctx.ellipse(0, 0, core * 1.26, core * 1.26, 0, 0.18, Math.PI - 0.18);
        ctx.lineWidth = Math.max(0.8, r * 0.052);
        ctx.strokeStyle = 'rgba(225, 162, 108, 0.42)';
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 0, core * 1.17, core * 1.17, 0, 0.28, Math.PI - 0.28);
        ctx.lineWidth = Math.max(0.5, r * 0.019);
        ctx.strokeStyle = 'rgba(183, 241, 229, 0.74)';
        ctx.stroke();
        ctx.restore();

        ctx.restore();
    }
});


/**
 * Particle
 */
function Particle(x, y, radius) {
    Vector.call(this, x, y);
    this.radius = radius;

    this._latest = new Vector();
    this._speed  = new Vector();
}

Particle.prototype = (function(o) {
    var s = new Vector(0, 0), p;
    for (p in o) s[p] = o[p];
    return s;
})({
    addSpeed: function(d) {
        this._speed.add(d);
    },

    update: function() {
        if (this._speed.length() > 12) this._speed.normalize().scale(12);

        this._latest.set(this);
        this.add(this._speed);
    }
});


(function() {

    var BACKGROUND_COLOR      = 'rgba(11, 51, 56, 1)',
        PARTICLE_RADIUS       = 1,
        G_POINT_RADIUS        = 10,
        G_POINT_RADIUS_LIMITS = 65;

    var canvas, context,
        bufferCvs, bufferCtx,
        screenWidth, screenHeight,
        mouse = new Vector(),
        gravities = [],
        particles = [],
        grad;

    function resize(e) {
        screenWidth  = canvas.width  = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
        bufferCvs.width  = screenWidth;
        bufferCvs.height = screenHeight;
        context   = canvas.getContext('2d');
        bufferCtx = bufferCvs.getContext('2d');

        var cx = canvas.width * 0.5,
            cy = canvas.height * 0.5;

        grad = context.createRadialGradient(cx, cy, 0, cx, cy, Math.sqrt(cx * cx + cy * cy));
        grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
    }

    function mouseMove(e) {
        mouse.set(e.clientX, e.clientY);

        var i, g, hit = false;
        for (i = gravities.length - 1; i >= 0; i--) {
            g = gravities[i];
            if ((!hit && g.hitTest(mouse)) || g.dragging)
                g.isMouseOver = hit = true;
            else
                g.isMouseOver = false;
        }

        canvas.style.cursor = hit ? 'pointer' : 'default';
    }

    function mouseDown(e) {
        // Pointer position must be refreshed on touch: mobile devices may not
        // send a pointermove before the first tap.
        mouse.set(e.clientX, e.clientY);

        for (var i = gravities.length - 1; i >= 0; i--) {
            if (!gravities[i].destroyed && gravities[i].hitTest(mouse)) {
                gravities[i].isMouseOver = true;
                gravities[i].startDrag(mouse);
                return;
            }
        }

        gravities.push(new GravityPoint(e.clientX, e.clientY, G_POINT_RADIUS, {
            particles: particles,
            gravities: gravities
        }));
    }

    function mouseUp(e) {
        for (var i = 0, len = gravities.length; i < len; i++) {
            if (gravities[i].dragging) {
                gravities[i].endDrag();
                break;
            }
        }
    }

    function doubleClick(e) {
        for (var i = gravities.length - 1; i >= 0; i--) {
            if (gravities[i].isMouseOver) {
                gravities[i].collapse();
                break;
            }
        }
    }

    function addParticle(num) {
        var i, p;
        for (i = 0; i < num; i++) {
            p = new Particle(
                Math.floor(Math.random() * screenWidth - PARTICLE_RADIUS * 2) + 1 + PARTICLE_RADIUS,
                Math.floor(Math.random() * screenHeight - PARTICLE_RADIUS * 2) + 1 + PARTICLE_RADIUS,
                PARTICLE_RADIUS
            );
            p.addSpeed(Vector.random());
            particles.push(p);
        }
    }

    function removeParticle(num) {
        if (particles.length < num) num = particles.length;
        for (var i = 0; i < num; i++) {
            particles.pop();
        }
    }

    canvas  = document.getElementById('c');
    bufferCvs = document.createElement('canvas');

    window.addEventListener('resize', resize, false);
    resize(null);

    addParticle(2000);

    // Mouse/stylus: Pointer Events. Touch: explicit Touch Events as well,
    // while ignoring touch Pointer Events so a single tap is never handled twice.
    canvas.addEventListener('pointermove', function(e) {
        if (e.pointerType !== 'touch') mouseMove(e);
    }, false);
    canvas.addEventListener('pointerdown', function(e) {
        if (e.pointerType === 'touch') return;
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
        mouseDown(e);
    }, false);
    canvas.addEventListener('pointerup', function(e) {
        if (e.pointerType === 'touch') return;
        mouseUp(e);
        if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
        }
    }, false);
    canvas.addEventListener('pointercancel', function(e) {
        if (e.pointerType !== 'touch') mouseUp(e);
    }, false);

    // Explicit touch handling for mobile browsers. preventDefault stops the
    // page from scrolling/zooming while the user creates or drags a ball.
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (e.changedTouches.length) mouseDown(e.changedTouches[0]);
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length) mouseMove(e.touches[0]);
    }, { passive: false });
    canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        mouseUp(e);
    }, { passive: false });
    canvas.addEventListener('touchcancel', function(e) {
        mouseUp(e);
    }, false);

    canvas.addEventListener('dblclick', doubleClick, false);

    var loop = function() {

        var i, len, g, p;

        context.save();
        context.fillStyle = BACKGROUND_COLOR;
        context.fillRect(0, 0, screenWidth, screenHeight);
        context.fillStyle = grad;
        context.fillRect(0, 0, screenWidth, screenHeight);
        context.restore();

        for (i = 0, len = gravities.length; i < len; i++) {
            g = gravities[i];
            if (g.dragging) g.drag(mouse);
            g.render();
            if (g.destroyed) {
                gravities.splice(i, 1);
                len--;
                i--;
            }
        }

        bufferCtx.save();
        bufferCtx.globalCompositeOperation = 'destination-out';
        bufferCtx.globalAlpha = 0.35;
        bufferCtx.fillRect(0, 0, screenWidth, screenHeight);
        bufferCtx.restore();

        len = particles.length;
        bufferCtx.save();
        bufferCtx.fillStyle = bufferCtx.strokeStyle = '#fff';
        bufferCtx.lineCap = bufferCtx.lineJoin = 'round';
        bufferCtx.lineWidth = PARTICLE_RADIUS * 2;
        bufferCtx.beginPath();

        for (i = 0; i < len; i++) {
            p = particles[i];
            p.update();
            bufferCtx.moveTo(p.x, p.y);
            bufferCtx.lineTo(p._latest.x, p._latest.y);
        }

        // Rounded line caps already render the particle endpoints as dots,
        // so a second pass drawing circles over the same points is redundant.
        bufferCtx.stroke();
        bufferCtx.restore();

        context.drawImage(bufferCvs, 0, 0);

        // Draw the black holes last so their event horizons truly mask the particle
        // trails instead of letting white streaks show through the black centre.
        // Their accretion disks still sit above the trails, like foreground light.
        for (i = 0, len = gravities.length; i < len; i++) {
            gravities[i]._draw(context);
        }

        requestAnimationFrame(loop);
    };

    loop();
document.addEventListener("click", function () {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    }
});
})();
</script>

</body>
</html>
